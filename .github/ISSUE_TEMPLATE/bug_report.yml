name: Bug Report
description: File a bug report to help us improve TalkingMirror
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open the app
        2. Tap Mirror Screen
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include screenshots/videos if applicable.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g., Pixel 8 Android 15, iPhone 16 iOS 18
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g., v0.1.0 build 42
  - type: dropdown
    id: screen
    attributes:
      label: Affected Screen
      options:
        - Mirror Screen
        - Compliment History
        - Subscription / Paywall
        - Settings
        - Onboarding
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues - this is not a duplicate
          required: true
        - label: I can reproduce this on the latest version
